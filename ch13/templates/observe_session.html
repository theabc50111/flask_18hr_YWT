{% extends "parts/base.html" %}

{% block title %}form{% endblock title %}

{% block page_content %}
{{ super() }}
<table class="table table-striped table-hover table-bordered">
    <thead>
        <tr>
        <tr>
            <th colspan="2">The table header</th>
        </tr>
        </tr>
    </thead>
    <tbody>
        {% for record in data %}
        <tr>
            <td scope="row">
                {{ record[0] }}
            </td>
            <td scope="row">
                {{ record[1] }}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock page_content %}
