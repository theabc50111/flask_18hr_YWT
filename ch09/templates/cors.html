{% extends "parts/base.html" %}

{% block title %}index{% endblock title %}
{% block page_content %}
{{ super() }}
<button type="button" class="btn btn-primary" id="fetch_origin_allow_cors">Fetch allowed CORS API</button>
<button type="button" class="btn btn-primary" id="fetch_origin_not_allow_cors">Fetch not allowed CORS API</button>
<br>
<p id='result'></p>
{% endblock page_content %}



<!-- practice start -->
{% block js %}
<script>
	document.getElementById('fetch_origin_allow_cors').addEventListener(
		'click',function(){
            console.log('fetch_origin_allow_cors');
            fetch('{{ api_url_origin_allow_cors }}')
				.then(r=>r.text())
				.then(t=>document.getElementById('result').textContent=t)
				.catch(e=>document.getElementById('result').textContent='Error:' + e);
		}
	);
	document.getElementById('fetch_origin_not_allow_cors').addEventListener(
		'click',function(){
            fetch('{{ api_url_origin_not_allow_cors }}')
				.then(r=>r.text())
				.then(t=>document.getElementById('result').textContent=t)
				.catch(e=>document.getElementById('result').textContent='Error:' + e);
		}
	);
</script>
{% endblock js %}
<!-- practice end -->
